name: Daily data (fundamentals, government trades, snapshot)

# 05:40 and 17:20 Singapore time on weekdays (after the US and SGX closes).
# Large daily files live on the `data` branch as a single commit, so the repository history stays small.
on:
  schedule:
    - cron: '40 21 * * 1-5'
    - cron: '20 9 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Restore yesterday's daily files
        run: |
          if git fetch --depth=1 origin data; then git checkout FETCH_HEAD -- d && cp d/*.json data/ && rm -rf d; fi
      - name: Analyst data, earnings dates, headlines
        run: python scripts/fetch_fundamentals.py
      - name: Government trades
        continue-on-error: true
        run: |
          python scripts/fetch_gov.py collect
          python scripts/gov_build.py "$(date -u +%F)" "$(date -u +%F)"
          python scripts/fetch_gov.py prices
          python scripts/gov_build.py "$(date -u +%F)" "$(date -u +%F)"
          python - <<'PY'
          import json
          t = json.load(open('out/gov_trades.json'))
          for x in t: x.pop('issuer', None)
          json.dump(t, open('out/gov_trades.json', 'w'), separators=(',', ':'))
          PY
          cp out/gov_trades.json out/gov_stocks.json out/gov_prices.json out/gov_sources.json data/
      - name: Price snapshot for Claude's daily analysis
        run: python scripts/fetch_yahoo.py
      - name: Publish to the data branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf pub && mkdir -p pub/d
          cp data/fundamentals.json data/gov_trades.json data/gov_stocks.json data/gov_prices.json data/gov_sources.json data/gov_filings.json data/gov_meta_cache.json raw/collect.json pub/d/ 2>/dev/null || true
          cd pub
          git init -q -b data
          git config user.name "jidai-bot"; git config user.email "jidai-bot@users.noreply.github.com"
          git add d && git commit -qm "Daily data $(date -u +%F)"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" data
          cd ..
          gh workflow run live.yml --ref main || true
